name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Where the "Checkout the packaging engine" step puts scratch-gui.
      SCRATCH_GUI: scratch-gui
    steps:
    - uses: actions/checkout@v4
    - name: Checkout the packaging engine
      uses: actions/checkout@v4
      with:
        repository: MistWarp/scratch-gui
        ref: develop
        path: scratch-gui
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Test
      run: npm test
    - name: Build standalone
      run: npm run build-standalone-prod
    - name: Upload standalone artifact
      uses: actions/upload-artifact@v4
      with:
        name: standalone
        path: dist/standalone.html
